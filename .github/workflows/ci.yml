name: CI

on:
  push:
  pull_request:

jobs:
  build-test-format:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y catch2 clang-format

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Format check
        run: |
          find include src test bench main.cpp -type f \( -name '*.cpp' -o -name '*.h' \) \
            | xargs clang-format --dry-run --Werror